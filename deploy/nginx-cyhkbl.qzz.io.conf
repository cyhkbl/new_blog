server {
    listen 80;
    server_name cyhkbl.qzz.io;

    # Finance-Learning
    location = /Finance-Learning { return 301 /Finance-Learning/; }
    location /Finance-Learning/ {
        alias /home/henry/zensical-sites/Finance-Learning/site/;
        try_files $uri $uri/ =404;
    }

    # CS-Learning
    location = /CS-Learning { return 301 /CS-Learning/; }
    location /CS-Learning/ {
        alias /home/henry/zensical-sites/CS-Learning/site/;
        try_files $uri $uri/ =404;
    }

    # Life
    location = /Life { return 301 /Life/; }
    location /Life/ {
        alias /home/henry/zensical-sites/Life/site/;
        try_files $uri $uri/ =404;
    }

    # LyricPost 小工具（原版静态应用，palinkiewicz/lyricpost，MIT）
    location = /lyricpost { return 301 /lyricpost/; }
    location /lyricpost/ {
        alias /home/henry/new_blog/frontend/public/lyricpost/;
        index index.html;
    }

    # Everything else -> Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
